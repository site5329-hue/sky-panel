<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SkyPanel - قدرتمندترین پنل کانفیگ</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  min-height: 100vh;
  font-family: 'Vazirmatn', sans-serif;
  background: #000;
  color: #fff;
  overflow: hidden;
}

/* ===== پس‌زمینه متحرک ===== */
.bg {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 50% 50%, #0a1a2e 0%, #000 100%);
  z-index: 0;
}

/* ===== ذرات نورانی ===== */
.particles {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

.particle {
  position: absolute;
  border-radius: 50%;
  background: #00BFFF;
  box-shadow: 0 0 10px #00BFFF, 0 0 20px #00BFFF;
  animation: rise linear infinite;
}

@keyframes rise {
  0% {
    transform: translateY(100vh) scale(0);
    opacity: 0;
  }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% {
    transform: translateY(-100px) scale(1);
    opacity: 0;
  }
}

/* ===== نورهای شناور ===== */
.glow {
  position: fixed;
  border-radius: 50%;
  filter: blur(150px);
  opacity: 0.4;
  z-index: 1;
  pointer-events: none;
}

.glow-1 {
  width: 600px;
  height: 600px;
  background: #00BFFF;
  top: -200px;
  right: -200px;
  animation: float 15s ease-in-out infinite;
}

.glow-2 {
  width: 500px;
  height: 500px;
  background: #00FF88;
  bottom: -200px;
  left: -200px;
  animation: float 18s ease-in-out infinite reverse;
}

@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(50px, -50px) scale(1.2); }
}

/* ===== محتوا ===== */
.container {
  position: relative;
  z-index: 10;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.card {
  max-width: 700px;
  width: 100%;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(0, 191, 255, 0.25);
  border-radius: 32px;
  padding: 60px 44px;
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  box-shadow:
    0 30px 100px rgba(0, 0, 0, 0.8),
    0 0 120px rgba(0, 191, 255, 0.15),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
  text-align: center;
  animation: cardIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
}

@keyframes cardIn {
  from {
    opacity: 0;
    transform: scale(0.9) translateY(30px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

/* ===== خط نورانی بالای کارت ===== */
.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #00BFFF, #00FF88, transparent);
  animation: scanLine 3s linear infinite;
}

@keyframes scanLine {
  0% { left: -100%; }
  100% { left: 100%; }
}

/* ===== آیکون اصلی ===== */
.icon-wrapper {
  position: relative;
  width: 140px;
  height: 140px;
  margin: 0 auto 36px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.icon-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: #00BFFF;
  border-right-color: #00FF88;
  animation: spin 3s linear infinite;
}

.icon-ring-2 {
  position: absolute;
  inset: 16px;
  border-radius: 50%;
  border: 2px solid transparent;
  border-bottom-color: #00FF88;
  border-left-color: #00BFFF;
  animation: spin 2s linear infinite reverse;
}

.icon-ring-3 {
  position: absolute;
  inset: 32px;
  border-radius: 50%;
  border: 1.5px solid transparent;
  border-top-color: rgba(0, 191, 255, 0.6);
  animation: spin 4s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.icon-core {
  position: relative;
  z-index: 2;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, #00BFFF, #00FF88);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  box-shadow:
    0 0 60px rgba(0, 191, 255, 0.8),
    0 0 100px rgba(0, 255, 136, 0.5);
  animation: pulse 2.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 60px rgba(0, 191, 255, 0.8), 0 0 100px rgba(0, 255, 136, 0.5);
  }
  50% {
    transform: scale(1.08);
    box-shadow: 0 0 80px rgba(0, 191, 255, 1), 0 0 140px rgba(0, 255, 136, 0.7);
  }
}

/* ===== تیتر گرادیانتی ===== */
.title {
  font-size: 42px;
  font-weight: 900;
  background: linear-gradient(135deg, #00BFFF, #00FF88, #00BFFF);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 16px;
  letter-spacing: 1px;
  animation: gradientMove 4s ease infinite;
  text-shadow: 0 0 60px rgba(0, 191, 255, 0.5);
}

@keyframes gradientMove {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

/* ===== زیرنویس ===== */
.subtitle {
  font-size: 17px;
  color: #CCDDEE;
  line-height: 2;
  margin-bottom: 36px;
  font-weight: 500;
}

.subtitle .highlight {
  color: #00FF88;
  font-weight: 700;
  text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
}

/* ===== خط جداکننده ===== */
.divider {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0, 191, 255, 0.5), transparent);
  margin: 32px 0;
}

/* ===== برچسب‌های ویژگی ===== */
.features {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-bottom: 36px;
}

.feature-badge {
  padding: 8px 18px;
  border-radius: 20px;
  background: rgba(0, 191, 255, 0.08);
  border: 1px solid rgba(0, 191, 255, 0.3);
  color: #00BFFF;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.3s;
  animation: badgeIn 0.6s ease backwards;
}

.feature-badge:nth-child(1) { animation-delay: 0.1s; }
.feature-badge:nth-child(2) { animation-delay: 0.2s; }
.feature-badge:nth-child(3) { animation-delay: 0.3s; }
.feature-badge:nth-child(4) { animation-delay: 0.4s; }

@keyframes badgeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.feature-badge:hover {
  background: rgba(0, 191, 255, 0.15);
  border-color: #00BFFF;
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(0, 191, 255, 0.3);
}

.feature-badge.green {
  background: rgba(0, 255, 136, 0.08);
  border-color: rgba(0, 255, 136, 0.3);
  color: #00FF88;
}

.feature-badge.green:hover {
  background: rgba(0, 255, 136, 0.15);
  border-color: #00FF88;
  box-shadow: 0 8px 25px rgba(0, 255, 136, 0.3);
}

/* ===== دکمه ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 18px 40px;
  border: none;
  border-radius: 18px;
  background: linear-gradient(135deg, #00BFFF, #00FF88);
  color: #000;
  font-family: inherit;
  font-size: 17px;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 10px 40px rgba(0, 191, 255, 0.4);
  text-decoration: none;
}

.btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 15px 60px rgba(0, 191, 255, 0.7);
}

.btn:active {
  transform: scale(0.97);
}

/* ===== نقطه‌های تزئینی ===== */
.dots {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(0, 191, 255, 0.3);
  animation: dotPulse 1.4s ease-in-out infinite;
}

.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes dotPulse {
  0%, 80%, 100% {
    transform: scale(0.8);
    background: rgba(0, 191, 255, 0.3);
  }
  40% {
    transform: scale(1.3);
    background: #00BFFF;
    box-shadow: 0 0 15px #00BFFF;
  }
}

/* ===== ریسپانسیو ===== */
@media (max-width: 600px) {
  .card { padding: 44px 24px; border-radius: 24px; }
  .title { font-size: 28px; }
  .subtitle { font-size: 14px; }
  .icon-wrapper { width: 110px; height: 110px; }
  .icon-core { width: 65px; height: 65px; font-size: 32px; }
  .btn { padding: 15px 30px; font-size: 15px; }
}
</style>
</head>
<body>

<!-- پس‌زمینه -->
<div class="bg"></div>

<!-- نورهای شناور -->
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<!-- ذرات -->
<div class="particles" id="particles"></div>

<!-- محتوا -->
<div class="container">
  <div class="card">

    <!-- آیکون سه‌حلقه‌ای -->
    <div class="icon-wrapper">
      <div class="icon-ring"></div>
      <div class="icon-ring-2"></div>
      <div class="icon-ring-3"></div>
      <div class="icon-core">⚡</div>
    </div>

    <!-- تیتر -->
    <h1 class="title">SkyPanel</h1>

    <!-- زیرنویس -->
    <p class="subtitle">
      <span class="highlight">قدرتمندترین پنل کانفیگ</span><br>
      سرعت، امنیت و آزادی در یک پنل
    </p>

    <!-- خط جداکننده -->
    <div class="divider"></div>

    <!-- برچسب‌های ویژگی -->
    <div class="features">
      <span class="feature-badge">🚀 پرسرعت</span>
      <span class="feature-badge green">🛡️ امن</span>
      <span class="feature-badge">💰 رایگان</span>
      <span class="feature-badge green">∞ نامحدود</span>
    </div>

    <!-- دکمه -->
    <a href="https://t.me/skypanell" target="_blank" class="btn">
      <span>📢</span>
      <span>ورود به کانال</span>
    </a>

    <!-- نقطه‌های تزئینی -->
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

  </div>
</div>

<script>
// ===== ساخت ذرات شناور =====
const particlesContainer = document.getElementById('particles');

for (let i = 0; i < 40; i++) {
  const particle = document.createElement('div');
  particle.className = 'particle';

  const size = Math.random() * 4 + 2;
  particle.style.width = size + 'px';
  particle.style.height = size + 'px';
  particle.style.left = Math.random() * 100 + '%';
  particle.style.animationDuration = (Math.random() * 10 + 8) + 's';
  particle.style.animationDelay = Math.random() * 10 + 's';

  // رنگ‌های مختلف
  const colors = ['#00BFFF', '#00FF88', '#FFFFFF'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  particle.style.background = color;
  particle.style.boxShadow = `0 0 10px ${color}, 0 0 20px ${color}`;

  particlesContainer.appendChild(particle);
}

// ===== تغییر رنگ تیتر با حرکت موس (دسکتاپ) =====
const card = document.querySelector('.card');

if (window.innerWidth > 768) {
  card.addEventListener('mousemove', (e) => {
    const rect = card.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;

    card.style.transform = `perspective(1000px) rotateY(${x * 8}deg) rotateX(${-y * 8}deg)`;
  });

  card.addEventListener('mouseleave', () => {
    card.style.transform = 'perspective(1000px) rotateY(0) rotateX(0)';
  });
}
</script>

</body>
</html>
